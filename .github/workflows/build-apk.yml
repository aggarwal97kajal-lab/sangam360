name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare app files
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp native-bridge.js www/native-bridge.js
          sed -i 's#<head>#<head><script src="native-bridge.js"></script>#' www/index.html
          python3 patch_push.py

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add app icon and fix screen fit
        run: |
          pip install pillow
          python3 brand.py

      - name: Add Firebase config and permissions
        run: |
          test -f google-services.json || (echo "google-services.json is missing from the repo" && exit 1)
          cp google-services.json android/app/google-services.json
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Copy app files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sangam360-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
