name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare app folder
        run: mkdir -p www && cp index.html www/index.html && cp native-bridge.js www/native-bridge.js

      - name: Add native bridge to the page
        run: sed -i 's#<head>#<head><script src="native-bridge.js"></script>#' www/index.html

      - name: Patch notifications
        run: python3 patch_push.py

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Install image tools
        run: pip install pillow

      - name: Add app icon and fix screen fit
        run: python3 brand.py

      - name: Add Firebase config
        run: if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; else echo "No google-services.json found - building without notifications"; fi

      # A fresh install must start clean - do not restore old app data (saved payment details, login) from a Google backup after a reinstall.
      - name: Turn off app data backup
        run: sed -i 's#android:allowBackup="true"#android:allowBackup="false"#' android/app/src/main/AndroidManifest.xml

      - name: Turn off app data backup (fallback)
        run: grep -q 'android:allowBackup' android/app/src/main/AndroidManifest.xml || sed -i '0,/<application/s#<application#<application android:allowBackup="false"#' android/app/src/main/AndroidManifest.xml

      - name: Add permissions
        run: sed -i 's#</manifest># <uses-permission android:name="android.permission.CAMERA" />\n <uses-permission android:name="android.permission.RECORD_AUDIO" />\n <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      # keeps "Share live location" updating in the background and when the phone is locked
      - name: Add background live location
        run: python3 live_native.py

      - name: Copy app files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Sangam360.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sangam360
          path: Sangam360.apk
