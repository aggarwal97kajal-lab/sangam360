name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The project can be uploaded as one zip file (Sangam360-Flutter.zip): it is unpacked here.
      - name: Unpack the project zip
        run: |
          Z=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$Z" ]; then
            echo "unpacking $Z"
            unzip -o -q "$Z" -d .
          fi
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # The repository has no binary files of Gradle: they are taken from a fresh Flutter project.
      - name: Add the Gradle wrapper
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --org com.sangam360 /tmp/gw_template >/dev/null
            cp /tmp/gw_template/android/gradlew android/gradlew
            cp /tmp/gw_template/android/gradlew.bat android/gradlew.bat
            mkdir -p android/gradle/wrapper
            cp /tmp/gw_template/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
            chmod +x android/gradlew
          fi

      # The app's own signing key (repository secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD) - the same key as the old app,
      # so the new APK installs over the old one and Google sign-in keeps working.
      - name: Add signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            (printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > android/app/sangam360.keystore) || rm -f android/app/sangam360.keystore
          fi
          if [ -f android/app/sangam360.keystore ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            if keytool -list -v -keystore android/app/sangam360.keystore -storetype PKCS12 -alias sangam360 -storepass:env KEYSTORE_PASSWORD | grep -E "SHA(1|-1|256):"; then
              echo "signing: this APK is signed with the app's own key"
            else
              echo "signing: the key and KEYSTORE_PASSWORD do not fit together - a temporary key is used"
              rm -f android/app/sangam360.keystore
            fi
          else
            rm -f android/app/sangam360.keystore
            echo "signing: no key in the repository secrets - this APK gets a temporary key (it will not install over the old app)"
          fi

      - name: Get packages
        run: flutter pub get

      # Lists every code problem at once. The errors are also shown as text on the run's page (Summary) and saved as the
      # "logs" artifact, so they can be copied and sent.
      - name: Check the code
        continue-on-error: true
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings lib > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          grep -E "^ *error " analyze.txt > errors.txt
          n=$(wc -l < errors.txt)
          {
            echo "## Code check: $n error(s)"
            echo '```'
            head -n 150 errors.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # Languages: every translation file is checked (a broken {0} placeholder fails here), then the automated tests run.
      - name: Check translations and run tests
        continue-on-error: true
        run: |
          set +e
          dart run tool/l10n_check.dart > l10n.txt 2>&1
          lc=$?
          flutter test --reporter expanded > test.txt 2>&1
          tc=$?
          cat l10n.txt
          tail -n 60 test.txt
          {
            echo "## Translations: $([ $lc -eq 0 ] && echo OK || echo PROBLEM)"
            echo '```'
            cat l10n.txt
            echo '```'
            echo "## Tests: $([ $tc -eq 0 ] && echo 'all passed' || echo FAILED)"
            echo '```'
            grep -E "^[0-9:]+ \+[0-9]+|Some tests failed|All tests passed|\[E\]|Expected|Actual|reason" test.txt | tail -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $(( lc + tc ))

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build.txt || {
            {
              echo "## Build failed"
              echo '```'
              grep -E "Error:|error:|FAILURE|What went wrong" -A3 build.txt | head -n 120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            analyze.txt
            build.txt
            l10n.txt
            test.txt
          if-no-files-found: ignore

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Sangam360.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sangam360
          path: Sangam360.apk
          
